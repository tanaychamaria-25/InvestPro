spring.application.name=InvestPro
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/investpro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:investpro_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=8000

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

logging.level.org.springframework.jdbc.core=INFO
